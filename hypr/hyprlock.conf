# ─────────────────────────────────────────────
# HYPRLOCK — Cubone / n01bc01
# ─────────────────────────────────────────────

# Wallpaper
background {
    monitor =
    path = ~/.config/hypr/wallpaper/cubone3.jpg
    blur_passes = 2
    blur_size = 5
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
}

# ─────────────────────────────────────────────
# CLOCK
# ─────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(c8a2ffff)
    font_size = 72
    font_family = IosevkaNF
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %B %d')"
    color = rgba(e3e1e9ff)
    font_size = 18
    font_family = IosevkaNF
    position = 0, 45
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# USER
# ─────────────────────────────────────────────

label {
    monitor =
    text = n01bc01
    color = rgba(c8a2ffff)
    font_size = 24
    font_family = IosevkaNF
    position = 0, -65
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# PASSWORD BOX
# ─────────────────────────────────────────────

input-field {
    monitor =

    size = 320, 55
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(c3b1e1ff)
    inner_color = rgba(121218cc)
    font_color = rgba(e3e1e9ff)

    fade_on_empty = false
    placeholder_text = <span foreground="##b1b7e1">Password</span>

    hide_input = false

    position = 0, -140
    halign = center
    valign = center
}

# ─────────────────────────────────────────────
# CAPS LOCK
# ─────────────────────────────────────────────

label {
    monitor =
    text = cmd[update:500] echo "$(hyprctl devices -j | jq -r '.keyboards[] | select(.name) | .capsLock' | grep -q true && echo 'CAPS LOCK ON' || echo '')"
    color = rgba(bd2426ff)
    font_size = 13
    font_family = IosevkaNF
    position = 0, -210
    halign = center
    valign = center
}
